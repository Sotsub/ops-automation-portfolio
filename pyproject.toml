[project]
name = "ops-automation-portfolio"
version = "0.1.0"
description = "Workflow automation portfolio for Bluefield Supply Co., a fictional distributor (demo data only)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dbt-core>=1.12.7",
    "dbt-postgres>=1.11.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.4",
]

[tool.uv]
# This repo is a set of apps, not a library to publish.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Demo-data tables keep one record per line so they read like a spreadsheet.
"erp/seed_data.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: needs live services such as ERPNext or Postgres (skipped in CI by default)",
]
