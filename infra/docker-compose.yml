# Bluefield Supply Co. shared stack (Foundation Step 5). Demo data only.
#
# Services: Postgres (reporting + app databases), Metabase, n8n, Mailpit.
# ERPNext runs separately from the official frappe_docker repository (make erp-up).
#
# Profiles keep the default stack small, to save Codespaces hours and memory:
#   core        postgres, mailpit   no profile key, so always started   make up
#   reporting   metabase                                                make up-reporting
#   automation  n8n                                                     make up-automation
#   everything                                                          make up-all
# Core stays unprofiled on purpose: metabase and n8n depend on postgres, and Compose does not
# start a dependency that sits behind a disabled profile.
#
# Without make:  docker compose -f infra/docker-compose.yml --env-file .env [--profile reporting] up -d --wait
#
# Rules this file follows (enforced by tests/test_compose.py):
# - exact image versions, never "latest"
# - every service has a health check
# - every port is bound to 127.0.0.1 only
# - secrets come from .env; compose refuses to start if one is missing
#
# Image versions checked on 2026-11-06:
#   postgres 18.6-alpine, metabase v0.64.5.4 (LTS line), n8n 2.46.6 (stable tag), mailpit v1.33.0

name: bluefield

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluefield_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run make env-secrets)}
      POSTGRES_DB: ${POSTGRES_DB:-bluefield}
      # Read by the init script to create the Metabase and n8n login roles.
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD in .env (run make env-secrets)}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env (run make env-secrets)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume mounts at /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check (-h 127.0.0.1): during first-time init the server listens on the
      # Unix socket only, so this stays unhealthy until init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 2s

  metabase:
    image: metabase/metabase:v0.64.5.4
    profiles: [reporting]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Metabase stores its own settings, users, and dashboards in Postgres (not H2).
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?Set METABASE_DB_PASSWORD in .env (run make env-secrets)}
      # Encrypts saved database connection details inside the Metabase app database.
      MB_ENCRYPTION_SECRET_KEY: ${MB_ENCRYPTION_SECRET_KEY:?Set MB_ENCRYPTION_SECRET_KEY in .env (run make env-secrets)}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_TIMEZONE: ${STACK_TIMEZONE:-America/New_York}
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # First start runs app-database migrations, which can take a few minutes.
      start_period: 240s
      start_interval: 5s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.46.6
    profiles: [automation]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?Set N8N_DB_PASSWORD in .env (run make env-secrets)}
      # Encrypts credentials saved in n8n. Losing it makes saved credentials unreadable.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env (run make env-secrets)}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      NODE_ENV: production
      GENERIC_TIMEZONE: ${STACK_TIMEZONE:-America/New_York}
      TZ: ${STACK_TIMEZONE:-America/New_York}
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    healthcheck:
      # /healthz/readiness returns 200 only once the database is connected and migrated.
      # Uses node because it is always present in the n8n image.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
      start_interval: 5s

  mailpit:
    image: axllent/mailpit:v1.33.0
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      # Local test inbox only: accept any SMTP login so apps need no mail credentials.
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      TZ: ${STACK_TIMEZONE:-America/New_York}
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
      start_interval: 1s

volumes:
  postgres-data:
  n8n-data:
  mailpit-data:
