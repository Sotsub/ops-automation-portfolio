# Connection details come from environment variables that pipeline/run.py sets from .env
# inside its own process. No password is stored here.
bluefield:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('BLUEFIELD_PG_HOST') }}"
      port: "{{ env_var('BLUEFIELD_PG_PORT') | as_number }}"
      user: "{{ env_var('BLUEFIELD_PG_USER') }}"
      password: "{{ env_var('BLUEFIELD_PG_PASSWORD') }}"
      dbname: "{{ env_var('BLUEFIELD_PG_DB') }}"
      schema: staging
      threads: 2
